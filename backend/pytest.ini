[pytest]
testpaths = tests
asyncio_mode = auto
# Our own deprecations are bugs; third-party ones are not ours to fix.
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:anyio.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
    ignore:.*starlette.testclient.*:UserWarning
