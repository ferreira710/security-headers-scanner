name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod asks for 1.22; this is what Netlify's build is pinned to.
          go-version: "1.24"
      # Formatting is not a matter of taste in Go: gofmt output is the standard.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "arquivos fora do gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # Builds both entry points -- the container binary and the Netlify
      # function -- so a break in either fails here rather than at deploy.
      - run: go build ./...
      - run: go test -race ./...

  frontend:
    name: frontend · typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Typecheck first: a type error should fail before the slower suites run.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker · images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The README tells people to run `docker compose up --build`; this keeps
      # that promise honest.
      - run: docker compose build
